################
### MONITORS ###
################

# monitor = DP-2, 3440x1440@180.00Hz, 0x0, 1, bitdepth, 10
# monitor = HDMI-A-2, 1440x900@74.98Hz, 3440x0, 1, transform, 1

monitorv2 {
  output = DP-2
  mode = 3440x1440@180.00Hz
  position = 0x0
  scale = 1
  transform = 0
  disabled = false
  bitdepth = 10
  vrr = 1
}
monitorv2 {
  output = HDMI-A-2
  mode = 1440x900@74.98Hz
  position = 3440x0
  scale = 1
  transform = 1
  disabled = false
  bitdepth = srgb
}

monitorv2 {
  output = HDMI-A-1
  mode = 1920x1080@60.00Hz
  position = 4340x0
  scale = 1
  transform = 0
  disabled = false
}


###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = dolphin
$menu = wofi


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_MENU_PREFIX,arch- 
env = HYPRCURSOR_THEME,catppuccin-mocha-dark-cursors
env = HYPRCURSOR_SIZE,24
env = GTK_THEME, Adwaita-dark
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,kvantum

###################
### PERMISSIONS ###
###################

permission = /usr/(bin|local/bin)/grim, screencopy, allow
permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

################
### SOURCING ###
################

source = ~/.config/hypr/hyprland/autostart.conf
source = ~/.config/hypr/hyprland/keybinds.conf
source = ~/.config/hypr/hyprland/look.conf
source = ~/.config/hypr/hyprland/input.conf
source = ~/.config/hypr/hyprland/windows-workspaces.conf
source = ~/.config/hypr/hyprland/plugins.conf
